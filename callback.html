<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Обработка VK ID</title>
</head>
<body>
  <p>Авторизация завершена. Можно закрыть окно.</p>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if (code) {
      window.opener.postMessage({ type: "vk_auth_code", code: code }, "*");
      window.close();
    } else {
      document.body.innerHTML = "<p>Ошибка: код авторизации не получен.</p>";
    }
  </script>
</body>
</html>

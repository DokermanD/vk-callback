<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VK Login</title>
    <script src="https://unpkg.com/@vkid/sdk@3.0.0/dist/sdk/umd/index.js"></script>
</head>
<body>
  <h2>Войти через VK ID</h2>

  <div id="vk_login_btn"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if ('VKIDSDK' in window) {
        const VKID = window.VKIDSDK;

        VKID.Config.init({
          app: 53500616,
          redirectUri: 'https://DokermanD.github.io/vk-callback/callback.html',
          responseMode: VKID.ConfigResponseMode.Callback,
          source: VKID.ConfigSource.LOWCODE,
          scope: ''
        });

        const oneTap = new VKID.OneTap();

        oneTap.render({
          container: document.getElementById("vk_login_btn"),
          showAlternativeLogin: true
        })
        .on(VKID.WidgetEvents.ERROR, err => {
          console.error("Ошибка VKID:", err);
        })
        .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, payload => {
          const code = payload.code;
          const deviceId = payload.device_id;

          alert("Получен код: " + code);
        });
      } else {
        console.error("VKID SDK не загружен");
      }
    });
  </script>
</body>
</html>
